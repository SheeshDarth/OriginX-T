# X1 repair-and-verify (HANDBOOK §9.3, B8 pilot -> B9 full; src/mitigation/repair.py).
#
#   python -m src.mitigation.harm   --config configs/grid.yaml --cells <cells below>   # harm scores first
#   python -m src.mitigation.repair --config configs/repair.yaml
#
# Needs the grid's pools (training sets) and results.jsonl (recovery); harm_guided and
# repr_sim also need the harm scores, which need the grid's checkpoints. Copy pools and
# checkpoints from the machine that ran the grid (HANDBOOK §12.3). Strategies without
# scores yet are skipped with a warning, so risk_guided/random/perplexity_filter/oracle can
# run first. A run cut short resumes from `output`.
#
# Pilot (B8): 1 seed, ratio 0.5, synthetic + recursive = 2 cells x 6 strategies = 12
# fine-tunes, ~75 s each on an RTX 2050, so ~15 min. Decide go/no-go at CP1; the cut-off is
# 2026-12-15 (pilot must beat random, otherwise report a negative result).
# The pilot (PR #122) was "go". Full (B9), below: every cell at ratios 0.5 and 1 for
# synthetic, recursive, paraphrased and benchmark_near, seeds 0-2 = 24 cells x 7 strategies;
# the 12 pilot rows are reused, so 156 new fine-tunes, ~3.3 h at ~75 s each. Harm scores first:
#   python -m src.mitigation.harm --config configs/grid.yaml --cells <the 22 new cells>
#
# Gate X1 (§11, fixed before results; computed in the summary): harm_guided recovery is at
# least 10 points above random's at ratio 0.5 on >= 2 of the 3 collapse types, every seed.
# D10 (fixed 2026-11-08, before B9): knn_guided (risk_knn) is a strategy; benchmark_near is
# scored by benchmark recovery; the summary's `secondary` reports harm_guided - risk_guided
# on every cell with a bootstrap CI, whatever the result.

grid_config: configs/grid.yaml
dataset: wikitext2
cells:
  - synthetic_r0.5_s0
  - synthetic_r0.5_s1
  - synthetic_r0.5_s2
  - synthetic_r1_s0
  - synthetic_r1_s1
  - synthetic_r1_s2
  - recursive_r0.5_s0
  - recursive_r0.5_s1
  - recursive_r0.5_s2
  - recursive_r1_s0
  - recursive_r1_s1
  - recursive_r1_s2
  - paraphrased_r0.5_s0
  - paraphrased_r0.5_s1
  - paraphrased_r0.5_s2
  - paraphrased_r1_s0
  - paraphrased_r1_s1
  - paraphrased_r1_s2
  - benchmark_near_r0.5_s0
  - benchmark_near_r0.5_s1
  - benchmark_near_r0.5_s2
  - benchmark_near_r1_s0
  - benchmark_near_r1_s1
  - benchmark_near_r1_s2
pilot_cells: [synthetic_r0.5_s0, recursive_r0.5_s0]
strategies: [harm_guided, repr_sim, risk_guided, knn_guided, random, perplexity_filter, oracle]
k: contaminated          # replace as many samples as the cell has contaminated ones (or an integer)
# Rare-cluster preservation (B10, H5): these strategies also run as <strategy>+rare, never
# emptying a cluster that is rare in the seed's clean draw (semantic.cluster_assignments).
# Empty until #65 settles the rule: as written it changes no pick at ratio 0.5 (rehearsal).
preserve_rare_clusters: []

device: auto
models_dir: data/models/repair   # git-ignored; repaired checkpoints are deleted after scoring
keep_models: false
output: reports/repair/wikitext2.jsonl   # repair/1 (§7.5), committed; summary next to it
