name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Tests import torch/transformers/datasets lazily, so CI skips the
          # heavy requirements.txt and fails loudly if a test does need them.
          pip install ruff pytest pyyaml
      - name: Lint
        run: ruff check --isolated --select F src tests  # real bugs only; style rules would flag existing code
      - name: Test
        run: pytest -q
