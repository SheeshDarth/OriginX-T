name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Tests import torch/transformers/datasets lazily, so CI skips the
          # heavy requirements.txt and fails loudly if a test does need them.
          # fastapi + httpx (TestClient) for the API contract tests, at the lock's versions:
          # pydantic is pinned too, since the generated openapi.json depends on it.
          pip install ruff pytest pyyaml fastapi==0.115.5 pydantic==2.12.5 httpx==0.28.1
      - name: Lint
        run: ruff check --isolated --select F src tests dashboard  # real bugs only; style rules would flag existing code
      - name: Test
        run: pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: dashboard/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck && pnpm lint && pnpm test
